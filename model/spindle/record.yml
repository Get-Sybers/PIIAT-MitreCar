# GENERATED by `python model/generate.py` (or `python -m piiat_mitrecar.spindle`) — do not edit by hand.
# The shape of a spindle: what a minted-identity CAR row IS — its header, the two
# native keys it carries, the linkage back to its artefact, and its invariants.
# Resolved from piiat_mitrecar/spindle.yml (the rules), the live maps (piiat_mitrecar.mappings)
# and the id recipe (piiat_mitrecar/ids.py) by piiat_mitrecar.spindle — the code the engine
# mints with. `python -m piiat_mitrecar.spindle --check` and tests/test_spindle_model.py
# fail on drift.

name: spindle
description: 'A spindle is a CAR event row whose guid was MINTED from the record''s own stable-identity
  fields (a disk-image row: log2timeline / Plaso and any other artefact parser with no sensor-minted id).
  It is the same table row as any other CAR event — the common header plus the object''s fields — carrying,
  in native, the readable key its guid was minted from and the scope that identity holds for. Sysmon /
  EVTX rows are not spindles: their guids are the sensor''s own.'
is_a: CAR event row — model/car/objects/<car_object>.yml (common_header + object_fields); no column is
  added
minted_by: piiat_mitrecar.normalize._spindle, from the registry entry (identity.yml) via piiat_mitrecar.ids.mint
properties:
  common_header:
  - timestamp
  - car_action
  - guid
  - owning_guid
  - link_confidence
  - source_artefact
  - source_host
  - native
  spindle:
  - name: guid
    column: guid
    type: string — RFC 4122 UUID, version 5
    description: uuid5(SPINDLE_NS, canonical_json(native.spindle_key)) = ids.guid_of(native.spindle_key)
      — re-mintable from the row itself; the key every relationship, dedupe and STIX observation uses
  - name: car_object
    column: (the table)
    type: one of the 13 CAR objects
    description: the object the row is; also native.spindle_key._obj
  - name: car_action
    column: car_action
    type: a car_action of the object
    description: 'NOT part of the guid: an entity''s events of different actions share it (the dedupe
      key adds the action)'
  - name: host
    column: source_host
    type: string
    description: the evidence host the row is scoped to — NOT part of the guid; every consumer scopes
      by it (the dedupe key, superset edges, derive's observed set, the STIX case ids)
  - name: timestamp
    column: timestamp
    type: ISO-8601 UTC, or null
    description: the CAR event time; part of the guid where the entry's identity names it (event_time
      / last_write / visit_time / run_time / recorded_time); null on an entity record (a PE's compile
      stamp is not an event)
  - name: contributing_artefact
    column: source_artefact
    type: a map key
    description: the artefact map that produced the row = the registry entry's `map` (identity.yml); with
      car_object and the spindle_key names it resolves the entry the guid was minted under
  - name: spindle_key
    column: native.spindle_key
    type: object
    shape:
      _obj: car_object
      _v: identity-key version (int)
      <name>: string
    names:
    - application
    - artefact_file
    - command
    - db_path
    - event_identifier
    - event_time
    - exe
    - file_path
    - file_reference
    - hive
    - image_path
    - interface_luid
    - key_path
    - last_write
    - lnk_file
    - origin
    - pid
    - prefetch_hash
    - recorded_time
    - run_time
    - sha1
    - sha256
    - terminal
    - url
    - user
    - user_identifier
    - usn
    - value_name
    - visit_time
    positional_names:
    - SourceImage
    - RecordId
    description: 'the readable identity key the guid was minted from: the object key, the entry''s identity-key
      version, and the entry''s identity names (cross_source) or the positional fields (within_source),
      every value in its rendering (str unless the entry overrides it)'
  - name: spindle_scope
    column: native.spindle_scope
    type: enum
    values:
    - cross_source
    - within_source
    description:
      cross_source: minted from the entry's intrinsic identity
      within_source: minted from the positional fields — deterministic inside this source only
  - name: container
    column: native.spindle_key.SourceImage / native.SourceImage
    type: string
    description: the raw container the record came from — in the key of a within_source row; kept natively
      by the maps that declare it (the `keep` list)
invariants:
- guid == ids.guid_of(native.spindle_key) == uuid5(SPINDLE_NS, canonical_json(native.spindle_key))
- native.spindle_key._obj == car_object
- native.spindle_key._v == the registry entry's version (the positional version on a within_source row)
- native.spindle_scope == cross_source  <=>  the key's names are the registry entry's identity names
- native.spindle_scope == within_source <=>  the key's names are the positional fields ['SourceImage',
  'RecordId']
- two rows with equal (source_host, car_object, guid, car_action[, target_guid, access_level]) are one
  event (relationships.yml dedupe_key)
- the guid is invariant under the source, parser and artefact name, the record's position and the host
  — only the contributing values and the entry version move it
validated_by: piiat_mitrecar.spindle.validate_record (tests/test_spindle_model.py)
