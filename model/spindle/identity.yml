external:
- name: evtx_record
  kind: record
  form:
    fields:
    - Computer
    - Channel
    - EventRecordId
  maps:
  - evtx_bits
  - evtx_more
  - evtx_process
  - evtx_rdp
  - evtx_security
  - evtx_security_sessions
  - evtx_services
  - evtx_sysmon
  car_object:
  - authentication
  - driver
  - file
  - flow
  - http
  - module
  - process
  - registry
  - service
  - thread
  - user_session
  stable_across: 'runs and tools over the same .evtx: the log''s own record number, per channel and host
    (EvtxECmd and the Plaso winevtx route agree)'
- name: jlecmd_entry
  kind: record
  form:
    fields:
    - SourceFile
    - EntryNumber
  maps:
  - jlecmd_dest
  car_object:
  - file
  stable_across: one DestList entry of one jump-list file (JLECmd's own numbering)
- name: memory_proc_offset
  kind: entity
  form:
    form: proc-{hex}
  maps: []
  car_object:
  - process
  stable_across: one memory image — the _EPROCESS offset PIIAT-Mem mints proc-<hex> from
- name: recmd_value
  kind: record
  form:
    fields:
    - HivePath
    - KeyPath
    - ValueName
  maps:
  - recmd_batch
  car_object:
  - registry
  stable_across: one value of one key of one hive file (RECmd batch output)
- name: sysmon_process_guid
  kind: entity
  form:
    marker:
      payload: ProcessGuid
  maps:
  - evtx_sysmon
  car_object:
  - process
  stable_across: 'every Sysmon event of one process, on any tool that parses the log: the sensor''s own
    process guid'
- name: zeek_fuid
  kind: entity
  form:
    fields:
    - fuid
  maps:
  - zeek_files
  car_object:
  - file
  stable_across: one file transfer within one capture; http.log names it in resp_fuids
- name: zeek_uid
  kind: entity
  form:
    field: uid
  maps:
  - zeek_conn
  car_object:
  - flow
  stable_across: every Zeek log of one connection in one capture — conn / http / files share the uid
- name: zeek_uid_trans_depth
  kind: record
  form:
    fields:
    - uid
    - trans_depth
  maps:
  - zeek_http
  - zeek_smtp
  car_object:
  - email
  - http
  stable_across: one HTTP transaction within its connection, in one capture
equality:
  rule: exact
  key:
  - case
  - source_host
  - car_object
  - guid
  requires:
    scope: intrinsic
    kind:
    - record
    - entity
    same_version: true
  never: positional
  external: exact value
  boundary:
    case: the batch tree (--case; default its basename) — no new car.db column
  implemented_by: '#41 PR B (crosssource union_edges); this registry ships the rule and the predicate'
