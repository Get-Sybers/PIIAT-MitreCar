# GENERATED by `python model/generate.py` (or `python -m piiat_mitrecar.spindle`) — do not edit by hand.
# The spindle row-identity registry: per artefact, the CAR object, the kind, the
# identity-key version and the ordered identity fields the guid is minted from (name
# <- source path on the event), the scope, the positional fallback; the external
# forms and the maps that carry them; the equality rule; the namespaces and the mint
# rule, materialized.
# Resolved from piiat_mitrecar/spindle.yml (the rules), the live maps (piiat_mitrecar.mappings)
# and the id recipe (piiat_mitrecar/ids.py) by piiat_mitrecar.spindle — the code the engine
# mints with. `python -m piiat_mitrecar.spindle --check` and tests/test_spindle_model.py
# fail on drift.

spindle:
  version: 1
  namespace:
    STIX_NS: 00abedb4-aa42-466c-9c01-fed23315a9b7
    CAR_NS: c59b6244-0ed6-57c9-9248-03376f66270d
    SPINDLE_NS: dd668a4a-3945-5171-b031-7eb064307058
  recipe:
    CAR_NS: uuid5(NAMESPACE_URL, "https://github.com/Get-Sybers/PIIAT-MitreCar/stix")
    SPINDLE_NS: uuid5(CAR_NS, "spindle")
  mint: 'uuid5(SPINDLE_NS, canonical_json({"_obj": <car_object>, "_v": <version>, <name>: <value>, ...}))'
  seam: piiat_mitrecar.ids.mint(car_object, identity, version) -> (guid, key); ids.guid_of(key) re-mints
    a row's own native.spindle_key
  canonical_json: sorted keys, no whitespace, UTF-8 (STIX 2.1 §2.9 / RFC 8785)
  rendering: str
  normalize:
  - str
  - json
  not_hashed:
  - source_artefact
  - the parser name
  - SourceImage / RecordId (unless positional)
  - source_host
  object_key: _obj
  version_key: _v
  positional:
    fields:
    - SourceImage
    - RecordId
    version: 1
  scopes:
    intrinsic: minted from the artefact's own identity fields — the same across tools, runs and sources
      of one image; a row whose components are incomplete falls back to positional
    positional: minted from the per-record index (SourceImage + RecordId) — deterministic inside this
      source only; never equated across sources
  kinds:
    record: 'a record-numbered / journal key: the SAME record (an MFT entry, a USN record, a journal id,
      a log record number)'
    entity: 'a content-like key: records that COINCIDE on the entity (a path + hash, a path + stamp, a
      program + run time)'
