name: lint-and-test

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' yamale yamllint
      - name: Data model (CAR + ATT&CK superset) is in sync
        run: python -m piiat_mitrecar.build_data_model --check
      - name: Source manifests are in sync with the maps
        run: python -m piiat_mitrecar.gen_sources --check
      - name: Validate source manifests against the CAR sensor schema (yamale)
        run: yamale -s piiat_mitrecar/car_source_schema.yaml sources/
      - name: yamllint
        run: yamllint -c .yamllint sources/ to-be-validated/
      - name: Tests
        run: pytest -q
